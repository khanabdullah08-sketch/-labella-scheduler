# One Netlify site per client. In each site's settings set:
#   TENANT             = thalasso | labella | ...      (folder name under tenants/)
#   SUPABASE_URL       = https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  = the project's *anon* key (public by design; never the service_role key)
[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
